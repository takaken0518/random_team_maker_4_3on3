<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <title>OBS TEAM CARD | スマブラ3on3 UNIT DRAFT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&family=Noto+Sans+JP:wght@500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="index.css">
</head>
<body class="bg-transparent obs-team-page">

  <main id="obs-team-stage" aria-label="OBS用単一チームカード">
    <div id="obs-team-mount"></div>
  </main>

  <!-- プレビュー・設定用フローティングバー（?hud=0 または Hキー、またはOBS上での自動非表示に対応） -->
  <aside id="obs-helper-bar" class="obs-helper-bar" aria-label="OBSカード切り替えツール">
    <div class="obs-helper-group">
      <span class="obs-helper-title">OBS TEAM VIEW</span>
      <div id="obs-team-tabs" class="obs-team-tabs"></div>
    </div>
    <div class="obs-helper-actions">
      <button type="button" class="btn btn-secondary btn-sm" id="btn-obs-rename">
        ✎ チーム名変更
      </button>
      <button type="button" class="btn btn-secondary btn-sm" id="btn-obs-style">
        表示形式: <strong id="obs-style-label">コンパクト</strong>
      </button>
      <button type="button" class="btn btn-secondary btn-sm" id="btn-obs-fighter">
        ファイター: <strong id="obs-fighter-label">表示</strong>
      </button>
      <button type="button" class="btn btn-secondary btn-sm" id="btn-obs-bg">
        背景: <strong id="obs-bg-label">OBS透過</strong>
      </button>
      <button type="button" class="btn btn-primary btn-sm" id="btn-obs-copy-url">
        🔗 OBS用URLをコピー
      </button>
      <button type="button" class="btn btn-secondary btn-sm" id="btn-obs-hide-bar" title="Hキーで再表示">
        バーを隠す (H)
      </button>
    </div>
  </aside>

  <div id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/team-view.js"></script>
</body>
</html>
